[package]
name = "emby-gpui"
version = "0.1.0"
edition = "2021"
description = "GPU-accelerated Emby desktop client powered by Rust and GPUI"
authors = ["Emby GPUI Team"]
license = "MIT"

[dependencies]
gpui = { path = "./vendor/gpui" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
sqlite = "0.36"
uuid = { version = "1.0", features = ["v4", "serde"] }
image = "0.24"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "emby-gpui"
path = "src/main.rs"
